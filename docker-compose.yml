version: '3.8'

services:
  # Main Avatar API Server
  avatar-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: ai-avatar-service:latest
    container_name: avatar-api
    ports:
      - "8000:8000"
    environment:
      # Device settings
      - DEVICE=cuda
      - CUDA_VISIBLE_DEVICES=0
      - OMP_NUM_THREADS=4
      # API Keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-4-20250514}
      # LiveKit Configuration
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Model paths
      - HF_HOME=/app/models/huggingface
      - TORCH_HOME=/app/models/torch
      - MUSETALK_MODEL_DIR=/app/models/musetalk
      - LIVEPORTRAIT_MODEL_DIR=/app/models/liveportrait
      # Performance tuning
      - TARGET_FPS=${TARGET_FPS:-30}
      # VIDEO_WIDTH/HEIGHT: 자동 감지됨 (avata_ani.mp4에서)
      # 환경변수로 오버라이드 가능: VIDEO_WIDTH, VIDEO_HEIGHT
      - TTS_SAMPLE_RATE=${TTS_SAMPLE_RATE:-24000}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./assets:/app/assets
      - ./logs:/app/logs
      - model-cache:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 16G
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped
    networks:
      - avatar-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # LiveKit WebRTC Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    ports:
      - "7880:7880"   # HTTP/WebSocket
      - "7881:7881"   # RTC/TCP
      - "7882:7882/udp"  # RTC/UDP
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    restart: unless-stopped
    networks:
      - avatar-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - avatar-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - avatar-api
    restart: unless-stopped
    networks:
      - avatar-network
    profiles:
      - production

volumes:
  redis-data:
  model-cache:
    name: ai-avatar-model-cache

networks:
  avatar-network:
    driver: bridge
